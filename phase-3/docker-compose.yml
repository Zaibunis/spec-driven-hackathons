version: '3.8'

# Credentials are provided via environment (host shell or .env next to this file).
# Copy .env.example to .env and set values. No default passwords here.
# Example:
#   DATABASE_URL=postgresql://user:${POSTGRES_PASSWORD}@db:5432/todo_db

services:
  backend:
    image: todo-backend
    ports:
      - "7860:7860"
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env (see .env.example)}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      - LOG_LEVEL=INFO
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    image: todo-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:7860
      - NEXT_PUBLIC_BACKEND_URL=http://backend:7860
    depends_on:
      - backend
    networks:
      - app-network

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todo_db}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      # No default password: required, fail fast if missing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
